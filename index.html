<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Le monde des doudous</title>
  <meta name="theme-color" content="#ffd9b8">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Doudous">
  <link rel="apple-touch-icon" href="assets/icones/icone-180.png">
  <link rel="icon" type="image/png" href="assets/icones/icone-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- L’écran en cours (accueil, memory…) est dessiné ici par js/app.js -->
  <main id="scene" class="ecran"></main>

  <!-- Cœurs et confettis -->
  <div id="calque-fete" aria-hidden="true"></div>

  <!-- Pause quand la durée de jeu est atteinte -->
  <div id="pause" class="calque cache">
    <div class="pause-doudou"></div>
    <div class="zzz" aria-hidden="true"><span>z</span><span>z</span><span>z</span></div>
  </div>

  <!-- Premier toucher : nécessaire pour autoriser le son et la voix (iPad, iPhone) -->
  <div id="demarrage" class="calque">
    <h1 class="titre">Le monde des doudous</h1>
    <button class="jouer" aria-label="Jouer"></button>
  </div>

  <!-- En portrait : demander de tourner la tablette -->
  <div id="tourne" class="calque" aria-hidden="true">
    <div class="tablette"></div>
  </div>

  <!-- Coin secret du menu parent : appui long de 3 secondes -->
  <div id="coin-parent" aria-hidden="true">
    <svg viewBox="0 0 40 40"><circle class="anneau" cx="20" cy="20" r="16"/></svg>
  </div>
  <div id="menu-parent" class="calque cache"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
